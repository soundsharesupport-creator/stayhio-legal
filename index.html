<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Stayhio — Legal & Support</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text",
                   "Helvetica Neue", Arial, sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 80px 24px;
    }

    h1 {
      font-size: 52px;
      line-height: 1;
      margin: 0 0 14px;
      letter-spacing: -1.5px;
    }

    .subtitle {
      font-size: 20px;
      color: #86868b;
      margin-bottom: 48px;
    }

    .card {
      display: block;
      background: #ffffff;
      border-radius: 22px;
      padding: 24px 26px;
      margin-bottom: 14px;
      text-decoration: none;
      color: #1d1d1f;
      transition: transform 0.15s ease;
    }

    .card:hover {
      transform: scale(1.01);
    }

    .title {
      font-size: 21px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .description {
      font-size: 16px;
      line-height: 1.45;
      color: #86868b;
    }

    footer {
      margin-top: 46px;
      color: #86868b;
      font-size: 14px;
      line-height: 1.5;
    }

    @media (max-width: 600px) {
      .container {
        padding: 56px 20px;
      }

      h1 {
        font-size: 44px;
      }

      .subtitle {
        font-size: 18px;
        margin-bottom: 36px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>Stayhio</h1>
    <div class="subtitle">Legal &amp; Support</div>

    <a class="card" href="privacy/">
      <div class="title">Privacy Policy</div>
      <div class="description">
        Learn how Stayhio handles information and protects your privacy.
      </div>
    </a>

    <a class="card" href="terms/">
      <div class="title">Terms of Use</div>
      <div class="description">
        Terms governing your use of Stayhio.
      </div>
    </a>

    <a class="card" href="support/">
      <div class="title">Support</div>
      <div class="description">
        Get help with Stayhio or contact support.
      </div>
    </a>

    <footer>
      © 2026 Stayhio. All rights reserved.
    </footer>
  </main>
</body>
</html>
